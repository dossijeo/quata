name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify-impact:
    name: Classify affected platforms
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.impact.outputs.docs_only }}
    steps:
      - name: Check out classification range
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed paths fail closed
        id: impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/classify-ci-impact.mjs --all --github-output "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            node scripts/classify-ci-impact.mjs --all --github-output "$GITHUB_OUTPUT"
          else
            node scripts/classify-ci-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze ${{ matrix.language }}
    needs: [classify-impact]
    if: ${{ github.event_name != 'pull_request' || needs.classify-impact.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
            config-file: ./.github/codeql/codeql-config.yml
          - language: javascript-typescript
            build-mode: none
            config-file: ./.github/codeql/javascript-config.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK used by the app
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ matrix.config-file }}
          queries: security-extended

      - name: Build Android sources for CodeQL
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
