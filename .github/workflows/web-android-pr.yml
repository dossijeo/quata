name: Web/Wasm and Android PR

on:
  pull_request:
    paths:
      - ".github/workflows/web-android-pr.yml"
      - "build-logic/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "app/**"
      - "core/**"
      - "designsystem/**"
      - "feature/**"
      - "web/**"
      - "scripts/web-browser-smoke.mjs"
      - "scripts/web-browser-metrics.mjs"
      - "scripts/wasm-bundle-report.mjs"
      - "docs/wasm-bundle-budget.json"
      - "docs/wasm-bundle-baseline.json"

concurrency:
  group: web-android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-wasm:
    name: Web/Wasm production bundle and Chrome smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20.19.0
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"

      - name: Set up Chrome 150
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "150"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Record Web toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/web-ci
          {
            java -version 2>&1
            node --version
            "${{ steps.chrome.outputs.chrome-path }}" --version
            ./gradlew --version
          } | tee build/reports/web-ci/toolchain.log

      - name: Build Wasm production distribution
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :web:wasmJsBrowserDistribution --no-daemon --stacktrace --console=plain \
            2>&1 | tee build/reports/web-ci/wasm-distribution.log

      - name: Report Wasm bundle
        if: ${{ always() && hashFiles('web/build/dist/wasmJs/productionExecutable/index.html') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d web/build/dist/wasmJs/productionExecutable
          node scripts/wasm-bundle-report.mjs \
            --budget docs/wasm-bundle-budget.json \
            --report build/reports/wasm-bundle/wasm-bundle-report.json \
            2>&1 | tee build/reports/web-ci/wasm-bundle-report.log

      - name: Smoke production launcher in Chrome
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          node scripts/web-browser-smoke.mjs \
            --chrome "${{ steps.chrome.outputs.chrome-path }}" \
            --metrics-report build/reports/web-browser-smoke-metrics.json \
            2>&1 | tee build/reports/web-ci/chrome-smoke.log
          node scripts/web-browser-metrics.mjs \
            --report build/reports/web-browser-smoke-metrics.json \
            2>&1 | tee build/reports/web-ci/chrome-metrics.log

      - name: Upload Web/Wasm diagnostics and distribution
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-wasm-pr-${{ github.run_id }}
          path: |
            build/reports/web-ci/
            build/reports/wasm-bundle/
            build/reports/web-browser-smoke-metrics.json
            web/build/dist/wasmJs/productionExecutable/
          if-no-files-found: warn
          retention-days: 14

  android-debug:
    name: Android debug assembly
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK 36.1
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Record Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/android-ci
          {
            java -version 2>&1
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
            ./gradlew --version
          } | tee build/reports/android-ci/toolchain.log

      - name: Assemble Android debug APK
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain \
            2>&1 | tee build/reports/android-ci/assemble-debug.log

      - name: Upload Android diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-pr-${{ github.run_id }}
          path: |
            build/reports/android-ci/
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14
