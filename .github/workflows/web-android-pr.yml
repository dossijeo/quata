name: Web/Wasm and Android PR

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    branches:
      - main
      - master

concurrency:
  group: web-android-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify-impact:
    name: Classify affected platforms
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.impact.outputs.web }}
      android: ${{ steps.impact.outputs.android }}
      unknown: ${{ steps.impact.outputs.unknown }}
      docs_only: ${{ steps.impact.outputs.docs_only }}
    steps:
      - name: Check out classification range
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed paths fail closed
        id: impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/classify-ci-impact.mjs --all --github-output "$GITHUB_OUTPUT"
          else
            node scripts/classify-ci-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi

  fast-contracts:
    name: PR fast contracts and focal imports
    needs: [classify-impact]
    if: ${{ github.event_name != 'pull_request' || needs.classify-impact.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JetBrains Runtime 21 for Gradle daemon
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21.0.8"
          check-latest: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20.19.0
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check diff and workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
          node --test scripts/web-android-pr-workflow-contract.test.mjs
          node --test scripts/ios-build-workflow-contract.test.mjs
          node --test scripts/codeql-workflow-contract.test.mjs
          node --test scripts/classify-ci-impact.test.mjs
          node --test scripts/candidate-attestation-contract.test.mjs
          node --test scripts/e2e-fixtures-chat-attachments-contract.test.mjs
          node --test scripts/whats-new-release-history-contract.test.mjs
          node --test scripts/legal-documents-parity-contract.test.mjs

      - name: Install Android SDK 36.1 for KMP configuration
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +e
          yes | "$sdkmanager" --licenses >/dev/null
          license_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${license_status[1]}" -ne 0 ]]; then
            exit "${license_status[1]}"
          fi
          if [[ "${license_status[0]}" -ne 0 && "${license_status[0]}" -ne 1 && "${license_status[0]}" -ne 141 ]]; then
            exit "${license_status[0]}"
          fi
          "$sdkmanager" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Compile focal Wasm imports
        if: ${{ needs.classify-impact.outputs.web == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew \
            :core:compileKotlinWasmJs \
            :feature:auth:compileKotlinWasmJs \
            :feature:feed:compileKotlinWasmJs \
            :feature:profile:compileKotlinWasmJs \
            --max-workers=1 --no-daemon --stacktrace --console=plain

  web-wasm:
    name: Web/Wasm final distribution and Chrome smoke
    needs: [classify-impact]
    if: ${{ needs.classify-impact.outputs.web == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'candidate-final')) }}
    runs-on: ubuntu-24.04
    # Distribution, browser smoke, and three cold-profile measurements run in this job.
    # Keep enough shared budget for all evidence rather than letting the final advisory gate time out.
    timeout-minutes: 100

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JetBrains Runtime 21 for Gradle daemon
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21.0.8"
          check-latest: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20.19.0
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"

      - name: Set up Chrome 150
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "150"
          install-dependencies: true

      - name: Install pinned browser E2E dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Run authenticated browser contract
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/web-ci
          npm run test:web-auth-browser-contract \
            2>&1 | tee build/reports/web-ci/auth-browser-contract.log

      - name: Configure Chrome launcher for Karma
        shell: bash
        run: |
          set -euo pipefail
          launcher="$RUNNER_TEMP/quata-chrome-no-sandbox"
          cat > "$launcher" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec "$QUATA_REAL_CHROME_BIN" --no-sandbox --disable-dev-shm-usage "$@"
          EOF
          chmod +x "$launcher"
          echo "QUATA_REAL_CHROME_BIN=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$launcher" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK 36.1 for KMP configuration
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +e
          yes | "$sdkmanager" --licenses >/dev/null
          license_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${license_status[1]}" -ne 0 ]]; then
            exit "${license_status[1]}"
          fi
          if [[ "${license_status[0]}" -ne 0 && "${license_status[0]}" -ne 1 && "${license_status[0]}" -ne 141 ]]; then
            exit "${license_status[0]}"
          fi
          "$sdkmanager" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Record Web toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/web-ci
          {
            java -version 2>&1
            node --version
            "${{ steps.chrome.outputs.chrome-path }}" --version
            bash ./gradlew --version
          } | tee build/reports/web-ci/toolchain.log

      - name: Run Web Wave 2 Node contracts
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/capability-matrix-contract.test.mjs
          node --test scripts/whats-new-release-history-contract.test.mjs
          node --test scripts/legal-documents-parity-contract.test.mjs
          npm run test:web-wave2-contracts \
            2>&1 | tee build/reports/web-ci/node-contracts.log

      - name: Test Web/Wasm
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          bash ./gradlew :core:wasmJsBrowserTest :web:wasmJsBrowserTest :designsystem:wasmJsBrowserTest :feature:auth:wasmJsBrowserTest :feature:chat:wasmJsBrowserTest :feature:externalshare:wasmJsBrowserTest :feature:feed:wasmJsBrowserTest :feature:neighborhoods:wasmJsBrowserTest :feature:notifications:wasmJsBrowserTest :feature:official:wasmJsBrowserTest :feature:postcomposer:wasmJsBrowserTest :feature:profile:wasmJsBrowserTest :feature:whatsnew:wasmJsBrowserTest -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.daemon.jvmargs=-Xmx3g --max-workers=1 --no-daemon --stacktrace --console=plain \
            2>&1 | tee build/reports/web-ci/wasm-test.log

      - name: Verify backend compatibility smoke policy (no network)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/backend-compatibility-request-policy.test.mjs
          node scripts/backend-compatibility-feed-detail.test.mjs
          node --check scripts/backend-compatibility-web-smoke.mjs

      - name: Build Wasm production distribution
        timeout-minutes: 38
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :web:wasmJsBrowserDistribution --no-daemon --stacktrace --console=plain \
            2>&1 | tee build/reports/web-ci/wasm-distribution.log

      - name: Report Wasm bundle
        if: ${{ always() && hashFiles('web/build/dist/wasmJs/productionExecutable/index.html') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/wasm-bundle-report.mjs \
            --budget docs/wasm-bundle-budget.json \
            --report build/reports/wasm-bundle/wasm-bundle-report.json \
            --policy-base "${{ github.event.pull_request.base.sha || github.event.before || github.sha }}" \
            2>&1 | tee build/reports/web-ci/wasm-bundle-report.log

      - name: Smoke production launcher, DocMentis and Auth in Chrome
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          node scripts/web-browser-smoke.mjs \
            --chrome "${{ steps.chrome.outputs.chrome-path }}" \
            --docmentis \
            --metrics-report build/reports/web-browser-smoke-metrics.json \
            2>&1 | tee build/reports/web-ci/chrome-smoke.log
          node scripts/web-browser-metrics.mjs \
            --report build/reports/web-browser-smoke-metrics.json \
            2>&1 | tee build/reports/web-ci/chrome-metrics.log
          QUATA_CHROME_PATH="${{ steps.chrome.outputs.chrome-path }}" \
            node scripts/web-share-target-pwa-e2e.mjs \
            2>&1 | tee build/reports/web-ci/share-target-e2e.log
          node scripts/web-authenticated-browser-e2e.mjs \
            --chrome "${{ steps.chrome.outputs.chrome-path }}" \
            --out build/reports/web-ci/authenticated-browser-e2e.json \
            2>&1 | tee build/reports/web-ci/authenticated-browser-e2e.log
          node scripts/web-chat-a11y-browser-e2e.mjs \
            --chrome "${{ steps.chrome.outputs.chrome-path }}" \
            --out build/reports/web-ci/chat-a11y-browser-e2e.json \
            2>&1 | tee build/reports/web-ci/chat-a11y-browser-e2e.log

      - name: Capture Official editor Web evidence
        timeout-minutes: 5
        shell: bash
        env:
          QUATA_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            npm run evidence:web-official-editor -- --require-pr-identity \
              2>&1 | tee build/reports/web-ci/official-editor-evidence.log
          else
            npm run evidence:web-official-editor \
              2>&1 | tee build/reports/web-ci/official-editor-evidence.log
          fi

      - name: Collect five cold Chrome measurements and advisory baseline proposal
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          node scripts/web-performance-repeatability.mjs \
            --dist web/build/dist/wasmJs/productionExecutable \
            --chrome "${{ steps.chrome.outputs.chrome-path }}" \
            --docmentis \
            --metrics-dir build/reports/web-performance-repeatability \
            --out build/reports/web-performance-repeatability.json \
            2>&1 | tee build/reports/web-ci/web-performance-repeatability.log

      - name: Upload Web/Wasm JUnit, smoke, logs and distribution
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-wasm-pr-${{ github.run_id }}
          path: |
            build/reports/web-ci/
            build/reports/wasm-bundle/
            build-reports/web/official-editor-evidence.json
            build-reports/web/official-editor-evidence/
            build/reports/web-browser-smoke-metrics.json
            build/reports/web-performance-repeatability.json
            build/reports/web-performance-repeatability/
            core/build/test-results/**/*.xml
            core/build/reports/tests/
            feature/postcomposer/build/test-results/**/*.xml
            feature/postcomposer/build/reports/tests/
            web/build/test-results/**/*.xml
            web/build/reports/tests/
            web/build/dist/wasmJs/productionExecutable/
          if-no-files-found: warn
          retention-days: 14

  android-unit-tests:
    name: Unit tests (${{ matrix.name }})
    needs: [classify-impact]
    if: ${{ needs.classify-impact.outputs.android == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'candidate-final')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android-app
            timeout_minutes: 35
            browser: false
            gradle_tasks: ":app:testDebugUnitTest :document-reader:testDebugUnitTest"
            gradle_args: ""
          - name: kmp-android-host
            timeout_minutes: 35
            browser: false
            gradle_tasks: ":core:testAndroidHostTest"
            gradle_args: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JetBrains Runtime 21 for Gradle daemon
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21.0.8"
          check-latest: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK 36.1
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +e
          yes | "$sdkmanager" --licenses >/dev/null
          license_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${license_status[1]}" -ne 0 ]]; then
            exit "${license_status[1]}"
          fi
          if [[ "${license_status[0]}" -ne 0 && "${license_status[0]}" -ne 1 && "${license_status[0]}" -ne 141 ]]; then
            exit "${license_status[0]}"
          fi
          "$sdkmanager" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Run declared unit-test tasks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/unit-tests
          bash ./gradlew ${{ matrix.gradle_tasks }} ${{ matrix.gradle_args }} --no-daemon --stacktrace --console=plain \
            2>&1 | tee "build/reports/unit-tests/${{ matrix.name }}.log"

      - name: Upload JUnit and unit-test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-tests-${{ matrix.name }}-${{ github.run_id }}
          path: |
            build/reports/unit-tests/
            **/build/test-results/**/*.xml
            **/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  web-unit-tests:
    name: Unit tests (kmp-wasm-common)
    needs: [classify-impact]
    if: ${{ needs.classify-impact.outputs.web == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'candidate-final')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JetBrains Runtime 21 for Gradle daemon
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21.0.8"
          check-latest: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20.19.0 for Wasm tests
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK 36.1 for KMP configuration
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +e
          yes | "$sdkmanager" --licenses >/dev/null
          license_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${license_status[1]}" -ne 0 ]]; then
            exit "${license_status[1]}"
          fi
          if [[ "${license_status[0]}" -ne 0 && "${license_status[0]}" -ne 1 && "${license_status[0]}" -ne 141 ]]; then
            exit "${license_status[0]}"
          fi
          "$sdkmanager" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Run Wasm/common unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/unit-tests
          bash ./gradlew :core:wasmJsNodeTest \
            -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.daemon.jvmargs=-Xmx3g --max-workers=1 \
            --no-daemon --stacktrace --console=plain \
            2>&1 | tee build/reports/unit-tests/kmp-wasm-common.log

      - name: Upload Wasm/common JUnit and unit-test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-tests-kmp-wasm-common-${{ github.run_id }}
          path: |
            build/reports/unit-tests/
            **/build/test-results/**/*.xml
            **/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  android-debug:
    name: Android lint and debug assembly
    needs: [classify-impact]
    if: ${{ needs.classify-impact.outputs.android == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'candidate-final')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JetBrains Runtime 21 for Gradle daemon
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21.0.8"
          check-latest: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK 36.1
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +e
          yes | "$sdkmanager" --licenses >/dev/null
          license_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${license_status[1]}" -ne 0 ]]; then
            exit "${license_status[1]}"
          fi
          if [[ "${license_status[0]}" -ne 0 && "${license_status[0]}" -ne 1 && "${license_status[0]}" -ne 141 ]]; then
            exit "${license_status[0]}"
          fi
          "$sdkmanager" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Record Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/android-ci
          {
            java -version 2>&1
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
            bash ./gradlew --version
          } | tee build/reports/android-ci/toolchain.log

      - name: Validate Android lint baseline ratchet
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/android-lint-baseline-ratchet.test.mjs
          node scripts/android-lint-baseline-ratchet.mjs docs/android-lint-baseline-ratchet.json

      - name: Lint Android modules
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:lintDebug :document-reader:lintDebug --continue \
            --no-daemon --stacktrace --console=plain \
            2>&1 | tee build/reports/android-ci/lint-debug.log

      - name: Assemble Android debug APK
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:verifyDebugComposeResources --no-daemon --stacktrace --console=plain \
            2>&1 | tee build/reports/android-ci/assemble-debug.log

      - name: Summarize Android lint debt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Android lint"
            echo
            echo ':app:lintDebug and :document-reader:lintDebug are required gates.'
            echo 'Versioned baselines retain inherited debt while the ratchet rejects any new issue id or increased occurrence count.'
            echo
            echo "### Reports"
            find app/build/reports document-reader/build/reports -iname 'lint-results-debug.*' -print 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android lint, logs and APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-pr-${{ github.run_id }}
          path: |
            build/reports/android-ci/
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-debug/
            document-reader/build/reports/lint-results-debug.*
            document-reader/build/reports/lint-results-debug/
          if-no-files-found: warn
          retention-days: 14

  final-certification-gate:
    name: Web/Android final certification gate
    needs: [classify-impact, web-wasm, web-unit-tests, android-unit-tests, android-debug]
    if: ${{ always() }}
    runs-on: ubuntu-24.04

    steps:
      - name: Fail closed unless this exact run is final-certified
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FINAL_CANDIDATE: ${{ contains(github.event.pull_request.labels.*.name, 'candidate-final') }}
          DOCS_ONLY: ${{ needs.classify-impact.outputs.docs_only }}
          WEB_AFFECTED: ${{ needs.classify-impact.outputs.web }}
          ANDROID_AFFECTED: ${{ needs.classify-impact.outputs.android }}
          WEB_FINAL_RESULT: ${{ needs.web-wasm.result }}
          WEB_UNIT_RESULT: ${{ needs.web-unit-tests.result }}
          ANDROID_UNIT_RESULT: ${{ needs.android-unit-tests.result }}
          ANDROID_FINAL_RESULT: ${{ needs.android-debug.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$DOCS_ONLY" == "true" ]]; then
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" && "$FINAL_CANDIDATE" != "true" ]]; then
            echo "A pull request must carry candidate-final before final certification can pass." >&2
            exit 1
          fi
          verify_lane() {
            local lane="$1"
            local affected="$2"
            local result="$3"
            if [[ "$affected" != "true" && "$affected" != "false" ]]; then
              echo "Final certification is invalid: '$lane' has affected='$affected'." >&2
              exit 1
            fi
            local expected_result="skipped"
            [[ "$affected" == "true" ]] && expected_result="success"
            if [[ "$result" != "$expected_result" ]]; then
              echo "Final certification is incomplete: '$lane' expected '$expected_result' but was '$result'." >&2
              exit 1
            fi
          }
