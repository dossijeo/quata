name: Web/Wasm and Android PR

on:
  pull_request:
    paths:
      - ".github/workflows/web-android-pr.yml"
      - ".github/workflows/wasm-baseline-capture.yml"
      - ".github/workflows/web-docmentis-staging-evidence.yml"
      - ".github/workflows/ios-build.yml"
      - "build-logic/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "app/**"
      - "core/**"
      - "designsystem/**"
      - "document-reader/**"
      - "feature/**"
      - "vosk_model_en/**"
      - "vosk_model_es/**"
      - "vosk_model_fr/**"
      - "web/**"
      - "capabilities/platform-capability-matrix.json"
      - "scripts/capability-matrix-contract.mjs"
      - "scripts/capability-matrix-contract.test.mjs"
      - "scripts/web-browser-smoke.mjs"
      - "scripts/web-browser-smoke-cleanup.mjs"
      - "scripts/web-browser-smoke-cleanup.test.mjs"
      - "scripts/web-browser-metrics.mjs"
      - "scripts/web-performance-repeatability.mjs"
      - "scripts/web-performance-repeatability.test.mjs"
      - "scripts/web-browser-network-policy.mjs"
      - "scripts/web-browser-network-policy.test.mjs"
      - "scripts/web-share-target-network-policy.mjs"
      - "scripts/web-share-target-pwa-e2e.mjs"
      - "scripts/web-share-target-pwa-e2e.test.mjs"
      - "scripts/web-pwa-push-lifecycle-contract.test.mjs"
      - "scripts/web-docmentis-product-smoke-contract.test.mjs"
      - "scripts/web-docmentis-staging-lifecycle-gate.mjs"
      - "scripts/web-docmentis-staging-lifecycle-gate.test.mjs"
      - "scripts/web-docmentis-staging-lifecycle-cli.mjs"
      - "scripts/web-docmentis-staging-lifecycle-cli.test.mjs"
      - "scripts/backend-compatibility-web-smoke.mjs"
      - "scripts/backend-compatibility-request-policy.mjs"
      - "scripts/backend-compatibility-request-policy.test.mjs"
      - "scripts/backend-compatibility-feed-detail.mjs"
      - "scripts/backend-compatibility-feed-detail.test.mjs"
      - "scripts/wasm-bundle-report.mjs"
      - "scripts/wasm-bundle-report.test.mjs"
      - "scripts/wasm-bundle-approval-policy.mjs"
      - "scripts/wasm-bundle-approval-policy.test.mjs"
      - "scripts/run-wasm-production-observed.ps1"
      - "scripts/web-android-pr-workflow-contract.test.mjs"
      - "scripts/wasm-baseline-capture-workflow-contract.test.mjs"
      - "scripts/ios-build-workflow-contract.test.mjs"
      - "scripts/web-test-contract.test.mjs"
      - "scripts/web-public-ux-smoke-contract.test.mjs"
      - "scripts/web-chat-browser-e2e-report.test.mjs"
      - "scripts/web-chat-browser-e2e-policy.mjs"
      - "scripts/web-chat-browser-e2e-policy.test.mjs"
      - "scripts/web-chat-browser-e2e.mjs"
      - "scripts/run-web-chat-browser-e2e.ps1"
      - "scripts/web-chat-exact-purge-gate.mjs"
      - "scripts/web-chat-exact-purge-gate.test.mjs"
      - "scripts/run-web-chat-exact-purge-gate.ps1"
      - "scripts/attest-web-chat-exact-purge.mjs"
      - "docs/WEB_CHAT_BROWSER_E2E.md"
      - "scripts/web-browser-metrics.test.mjs"
      - "docs/WEB_PERFORMANCE_REPEATABILITY.md"
      - "scripts/web-authenticated-browser-e2e.mjs"
      - "scripts/web-authenticated-browser-security.mjs"
      - "scripts/web-authenticated-browser-e2e.test.mjs"
      - "scripts/run-web-authenticated-browser-e2e.ps1"
      - "package.json"
      - "package-lock.json"
      - "docs/CI_WEB_ANDROID.md"
      - "docs/WEB_AUTHENTICATED_BROWSER_E2E.md"
      - "docs/WEB_DOCMENTIS_STAGING_LIFECYCLE_EVIDENCE.md"
      - "docs/schemas/docmentis-staging-lifecycle-evidence-v1.schema.json"
      - "docs/wasm-bundle-budget.json"
      - "docs/wasm-bundle-baseline.json"

concurrency:
  group: web-android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-wasm:
    name: Web/Wasm test, bundle and Chrome smoke
    runs-on: ubuntu-24.04
    # Distribution, browser smoke, and three cold-profile measurements run in this job.
    # Keep enough shared budget for all evidence rather than letting the final advisory gate time out.
    timeout-minutes: 100

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JetBrains Runtime 21 for Gradle daemon
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"
          set-default: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20.19.0
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"

      - name: Set up Chrome 150
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "150"
          install-dependencies: true

      - name: Install pinned browser E2E dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Run authenticated browser contract
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/web-ci
          npm run test:web-auth-browser-contract \
            2>&1 | tee build/reports/web-ci/auth-browser-contract.log

      - name: Configure Chrome launcher for Karma
        shell: bash
        run: |
          set -euo pipefail
          launcher="$RUNNER_TEMP/quata-chrome-no-sandbox"
          cat > "$launcher" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec "$QUATA_REAL_CHROME_BIN" --no-sandbox --disable-dev-shm-usage "$@"
          EOF
          chmod +x "$launcher"
          echo "QUATA_REAL_CHROME_BIN=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$launcher" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK 36.1 for KMP configuration
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +e
          yes | "$sdkmanager" --licenses >/dev/null
          license_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${license_status[1]}" -ne 0 ]]; then
            exit "${license_status[1]}"
          fi
          if [[ "${license_status[0]}" -ne 0 && "${license_status[0]}" -ne 1 && "${license_status[0]}" -ne 141 ]]; then
            exit "${license_status[0]}"
          fi
          "$sdkmanager" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Record Web toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/web-ci
          {
            java -version 2>&1
            node --version
            "${{ steps.chrome.outputs.chrome-path }}" --version
            bash ./gradlew --version
          } | tee build/reports/web-ci/toolchain.log

      - name: Run Web Wave 2 Node contracts
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/capability-matrix-contract.test.mjs
          npm run test:web-wave2-contracts \
            2>&1 | tee build/reports/web-ci/node-contracts.log

      - name: Test Web/Wasm
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          bash ./gradlew :web:wasmJsBrowserTest :designsystem:wasmJsBrowserTest :feature:auth:wasmJsBrowserTest :feature:chat:wasmJsBrowserTest :feature:externalshare:wasmJsBrowserTest :feature:feed:wasmJsBrowserTest :feature:neighborhoods:wasmJsBrowserTest :feature:notifications:wasmJsBrowserTest :feature:official:wasmJsBrowserTest :feature:profile:wasmJsBrowserTest :feature:whatsnew:wasmJsBrowserTest -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.daemon.jvmargs=-Xmx3g --max-workers=1 --no-daemon --stacktrace --console=plain \
            2>&1 | tee build/reports/web-ci/wasm-test.log

      - name: Verify backend compatibility smoke policy (no network)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/backend-compatibility-request-policy.test.mjs
          node scripts/backend-compatibility-feed-detail.test.mjs
          node --check scripts/backend-compatibility-web-smoke.mjs

      - name: Build Wasm production distribution
        timeout-minutes: 38
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :web:wasmJsBrowserDistribution --no-daemon --stacktrace --console=plain \
            2>&1 | tee build/reports/web-ci/wasm-distribution.log

      - name: Report Wasm bundle
        if: ${{ always() && hashFiles('web/build/dist/wasmJs/productionExecutable/index.html') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/wasm-bundle-report.mjs \
            --budget docs/wasm-bundle-budget.json \
            --report build/reports/wasm-bundle/wasm-bundle-report.json \
            --policy-base "${{ github.event.pull_request.base.sha }}" \
            2>&1 | tee build/reports/web-ci/wasm-bundle-report.log

      - name: Smoke production launcher, DocMentis and Auth in Chrome
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          node scripts/web-browser-smoke.mjs \
            --chrome "${{ steps.chrome.outputs.chrome-path }}" \
            --docmentis \
            --metrics-report build/reports/web-browser-smoke-metrics.json \
            2>&1 | tee build/reports/web-ci/chrome-smoke.log
          node scripts/web-browser-metrics.mjs \
            --report build/reports/web-browser-smoke-metrics.json \
            2>&1 | tee build/reports/web-ci/chrome-metrics.log
          QUATA_CHROME_PATH="${{ steps.chrome.outputs.chrome-path }}" \
            node scripts/web-share-target-pwa-e2e.mjs \
            2>&1 | tee build/reports/web-ci/share-target-e2e.log
          node scripts/web-authenticated-browser-e2e.mjs \
            --chrome "${{ steps.chrome.outputs.chrome-path }}" \
            --out build/reports/web-ci/authenticated-browser-e2e.json \
            2>&1 | tee build/reports/web-ci/authenticated-browser-e2e.log

      - name: Collect five cold Chrome measurements and advisory baseline proposal
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          node scripts/web-performance-repeatability.mjs \
            --dist web/build/dist/wasmJs/productionExecutable \
            --chrome "${{ steps.chrome.outputs.chrome-path }}" \
            --docmentis \
            --metrics-dir build/reports/web-performance-repeatability \
            --out build/reports/web-performance-repeatability.json \
            2>&1 | tee build/reports/web-ci/web-performance-repeatability.log

      - name: Upload Web/Wasm JUnit, smoke, logs and distribution
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-wasm-pr-${{ github.run_id }}
          path: |
            build/reports/web-ci/
            build/reports/wasm-bundle/
            build/reports/web-browser-smoke-metrics.json
            build/reports/web-performance-repeatability.json
            build/reports/web-performance-repeatability/
            web/build/test-results/**/*.xml
            web/build/reports/tests/
            web/build/dist/wasmJs/productionExecutable/
          if-no-files-found: warn
          retention-days: 14

  unit-tests:
    name: Unit tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android-app
            timeout_minutes: 35
            browser: false
            gradle_tasks: ":app:testDebugUnitTest :document-reader:testDebugUnitTest"
            gradle_args: ""
          - name: kmp-android-host
            timeout_minutes: 35
            browser: false
            gradle_tasks: ":core:testAndroidHostTest"
            gradle_args: ""
          - name: kmp-wasm-common
            timeout_minutes: 65
            browser: true
            gradle_tasks: ":core:wasmJsNodeTest"
            gradle_args: "-Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.daemon.jvmargs=-Xmx3g --max-workers=1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JetBrains Runtime 21 for Gradle daemon
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"
          set-default: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20.19.0 for Wasm tests
        if: matrix.browser
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK 36.1
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +e
          yes | "$sdkmanager" --licenses >/dev/null
          license_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${license_status[1]}" -ne 0 ]]; then
            exit "${license_status[1]}"
          fi
          if [[ "${license_status[0]}" -ne 0 && "${license_status[0]}" -ne 1 && "${license_status[0]}" -ne 141 ]]; then
            exit "${license_status[0]}"
          fi
          "$sdkmanager" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Run declared unit-test tasks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/unit-tests
          bash ./gradlew ${{ matrix.gradle_tasks }} ${{ matrix.gradle_args }} --no-daemon --stacktrace --console=plain \
            2>&1 | tee "build/reports/unit-tests/${{ matrix.name }}.log"

      - name: Upload JUnit and unit-test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-tests-${{ matrix.name }}-${{ github.run_id }}
          path: |
            build/reports/unit-tests/
            **/build/test-results/**/*.xml
            **/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  android-debug:
    name: Android lint and debug assembly
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JetBrains Runtime 21 for Gradle daemon
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"
          set-default: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK 36.1
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +e
          yes | "$sdkmanager" --licenses >/dev/null
          license_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${license_status[1]}" -ne 0 ]]; then
            exit "${license_status[1]}"
          fi
          if [[ "${license_status[0]}" -ne 0 && "${license_status[0]}" -ne 1 && "${license_status[0]}" -ne 141 ]]; then
            exit "${license_status[0]}"
          fi
          "$sdkmanager" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Record Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/android-ci
          {
            java -version 2>&1
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
            bash ./gradlew --version
          } | tee build/reports/android-ci/toolchain.log

      - name: "Lint Android modules (advisory: inherited lint debt)"
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:lintDebug :document-reader:lintDebug --continue \
            --no-daemon --stacktrace --console=plain \
            2>&1 | tee build/reports/android-ci/lint-debug.log

      - name: Assemble Android debug APK
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain \
            2>&1 | tee build/reports/android-ci/assemble-debug.log

      - name: Summarize Android lint debt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Android lint (advisory)"
            echo
            echo ':app:lintDebug and :document-reader:lintDebug are advisory while inherited debt is remediated.'
            echo 'The app unit tests, document-reader unit tests, and :app:assembleDebug remain required gates.'
            echo
            echo "### Reports"
            find app/build/reports document-reader/build/reports -iname 'lint-results-debug.*' -print 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android lint, logs and APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-pr-${{ github.run_id }}
          path: |
            build/reports/android-ci/
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-debug/
            document-reader/build/reports/lint-results-debug.*
            document-reader/build/reports/lint-results-debug/
          if-no-files-found: warn
          retention-days: 14
