name: iOS compile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-build.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "core/**"
      - "designsystem/**"
      - "feature/**"
      - "web/**"
      - "iosApp/**"
  push:
    branches:
      - main
      - master
      - "codex/**"
    paths:
      - ".github/workflows/ios-build.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "core/**"
      - "designsystem/**"
      - "feature/**"
      - "web/**"
      - "iosApp/**"

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-ios:
    name: Kotlin iOS and Swift host
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Select Xcode 16.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.3"

      - name: Install Xcode-compatible iOS Simulator runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_version="18.4"
          if ! xcrun simctl list runtimes available | grep -Fq "iOS ${runtime_version}"; then
            runtime_download_dir="$RUNNER_TEMP/quata-ios-${runtime_version}-runtime"
            rm -rf "$runtime_download_dir"
            mkdir -p "$runtime_download_dir"
            xcodebuild \
              -downloadPlatform iOS \
              -buildVersion "$runtime_version" \
              -exportPath "$runtime_download_dir"
            runtime_dmg="$(find "$runtime_download_dir" -name '*.dmg' -type f -print -quit)"
            test -n "$runtime_dmg"
            xcodebuild -importPlatform "$runtime_dmg"
          fi
          # Xcode 16.3 can retain a stale CoreSimulator connection after importing a runtime.
          # Restart before creating a device so simctl and xcodebuild use the same registry.
          pkill -f 'CoreSimulatorService' || true
          sleep 3
          runtime_identifier="$(
            xcrun simctl list runtimes available -j | python3 -c 'import json,sys; print(next((runtime["identifier"] for runtime in json.load(sys.stdin)["runtimes"] if runtime.get("isAvailable") and runtime.get("name", "") == "iOS 18.4"), ""))'
          )"
          device_type_identifier="$(
            xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print(next((device_type["identifier"] for device_type in json.load(sys.stdin)["devicetypes"] if device_type.get("name") == "iPhone 16 Pro"), ""))'
          )"
          test -n "$runtime_identifier"
          test -n "$device_type_identifier"
          device_name="Quata CI iPhone iOS ${runtime_version}"
          if ! xcrun simctl list devices "$runtime_identifier" | grep -Fq "$device_name"; then
            xcrun simctl create "$device_name" "$device_type_identifier" "$runtime_identifier"
          fi
          echo "Selected iOS runtime: $runtime_identifier"
          echo "Selected simulator type: $device_type_identifier"
          xcrun simctl list devices "$runtime_identifier"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/ios
          {
            echo "Runner: $RUNNER_OS $RUNNER_ARCH"
            java -version 2>&1
            ./gradlew --version
            xcodebuild -version
            xcodegen --version
            sw_vers
          } | tee build/reports/ios/toolchain.log

      - name: Compile all Kotlin iOS targets
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :core:compileKotlinIosArm64 \
            :core:compileKotlinIosSimulatorArm64 \
            :designsystem:compileKotlinIosArm64 \
            :designsystem:compileKotlinIosSimulatorArm64 \
            :feature:auth:compileKotlinIosArm64 \
            :feature:auth:compileKotlinIosSimulatorArm64 \
            :feature:chat:compileKotlinIosArm64 \
            :feature:chat:compileKotlinIosSimulatorArm64 \
            :feature:externalshare:compileKotlinIosArm64 \
            :feature:externalshare:compileKotlinIosSimulatorArm64 \
            :feature:feed:compileKotlinIosArm64 \
            :feature:feed:compileKotlinIosSimulatorArm64 \
            :feature:neighborhoods:compileKotlinIosArm64 \
            :feature:neighborhoods:compileKotlinIosSimulatorArm64 \
            :feature:notifications:compileKotlinIosArm64 \
            :feature:notifications:compileKotlinIosSimulatorArm64 \
            :feature:official:compileKotlinIosArm64 \
            :feature:official:compileKotlinIosSimulatorArm64 \
            :feature:postcomposer:compileKotlinIosArm64 \
            :feature:postcomposer:compileKotlinIosSimulatorArm64 \
            :feature:profile:compileKotlinIosArm64 \
            :feature:profile:compileKotlinIosSimulatorArm64 \
            :feature:settings:compileKotlinIosArm64 \
            :feature:settings:compileKotlinIosSimulatorArm64 \
            :feature:whatsnew:compileKotlinIosArm64 \
            :feature:whatsnew:compileKotlinIosSimulatorArm64 \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee build/reports/ios/kotlin-ios.log

      - name: Link QuataFeed simulator framework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :feature:feed:linkDebugFrameworkIosSimulatorArm64 \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee build/reports/ios/framework-link.log

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build Swift iOS host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/reports/ios/QuataIos.xcresult build/ios-derived-data
          xcodebuild \
            -project iosApp/QuataIos.xcodeproj \
            -scheme QuataIos \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios-derived-data \
            -resultBundlePath build/reports/ios/QuataIos.xcresult \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            2>&1 | tee build/reports/ios/xcodebuild.log

      - name: Test Swift/Kotlin iOS host boundary
        shell: bash
        run: |
          set -euo pipefail
          if ! available_destinations="$(
            xcodebuild \
              -project iosApp/QuataIos.xcodeproj \
              -scheme QuataIos \
              -sdk iphonesimulator \
              -showdestinations \
              2>&1
          )"; then
            echo "Unable to enumerate Xcode destinations for QuataIos:" >&2
            printf '%s\n' "$available_destinations" >&2
            exit 1
          fi
          simulator_udid="$(
            printf '%s\n' "$available_destinations" \
              | awk '
                  /platform:iOS Simulator/ {
                    if (match($0, /id:[[:space:]]*[0-9A-Fa-f-]+/)) {
                      identifier = substr($0, RSTART, RLENGTH)
                      sub(/^id:[[:space:]]*/, "", identifier)
                      print identifier
                      exit
                    }
                  }
                '
          )"
          if [[ ! "$simulator_udid" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "No eligible iOS Simulator UUID was reported by Xcode 16.3:" >&2
            printf '%s\n' "$available_destinations" >&2
            exit 1
          fi
          echo "Selected Xcode-eligible iOS Simulator: $simulator_udid"
          xcrun simctl boot "$simulator_udid" || true
          xcrun simctl bootstatus "$simulator_udid" -b
          rm -rf build/reports/ios/QuataIos-tests.xcresult
          xcodebuild \
            -project iosApp/QuataIos.xcodeproj \
            -scheme QuataIos \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath build/ios-derived-data \
            -resultBundlePath build/reports/ios/QuataIos-tests.xcresult \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test \
            2>&1 | tee build/reports/ios/xcodebuild-tests.log

      - name: Write report summary
        if: always()
        shell: bash
        run: |
          if [[ -d build/reports/ios/QuataIos-tests.xcresult ]]; then
            xcrun xcresulttool get test-results summary \
              --path build/reports/ios/QuataIos-tests.xcresult \
              > build/reports/ios/xctest-summary.json || true
          fi
          {
            echo "## iOS compilation report"
            echo
            echo "- Runner: \`macos-15\` (Apple Silicon)"
            echo "- Xcode: \`16.3\`"
            echo "- Kotlin targets: device ARM64 and simulator ARM64"
            echo "- Swift host: \`QuataIos\` for the iOS Simulator"
            echo "- UI test: Swift host presents the exported Compose migration surface"
            echo "- Result bundles: \`QuataIos.xcresult\`, \`QuataIos-tests.xcresult\`"
            echo
            if [[ -f build/reports/ios/xcodebuild.log ]]; then
              echo "### Last Xcode diagnostics"
              echo '```text'
              grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build/reports/ios/xcodebuild.log | tail -n 80 || true
              echo '```'
            fi
            if [[ -f build/reports/ios/xcodebuild-tests.log ]]; then
              echo "### Last UI test diagnostics"
              echo '```text'
              grep -E "error:|warning:|TEST (SUCCEEDED|FAILED)" build/reports/ios/xcodebuild-tests.log | tail -n 80 || true
              echo '```'
            fi
            if [[ -f build/reports/ios/xctest-summary.json ]]; then
              echo "### XCTest result summary"
              echo '```json'
              cat build/reports/ios/xctest-summary.json
              echo '```'
            fi
            if [[ ! -f build/reports/ios/xcodebuild.log && ! -f build/reports/ios/xcodebuild-tests.log && -f build/reports/ios/kotlin-ios.log ]]; then
              echo "### Last Kotlin diagnostics"
              echo '```text'
              grep -E "^[ew]: |error:|warning:|FAILURE:" build/reports/ios/kotlin-ios.log | tail -n 80 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Gradle reports
        if: always()
        shell: bash
        run: |
          mkdir -p build/reports/ios/gradle
          find . -type f -path "*/build/reports/*" \
            ! -path "./build/reports/ios/*" \
            -exec cp -p {} build/reports/ios/gradle/ \; || true

      - name: Upload iOS diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-report-${{ github.run_id }}
          path: |
            build/reports/ios/
            iosApp/QuataIos.xcodeproj/
            feature/feed/build/bin/iosSimulatorArm64/debugFramework/QuataFeed.framework/
          if-no-files-found: warn
          retention-days: 30
