name: iOS compile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-build.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "core/**"
      - "designsystem/**"
      - "ios-shared/**"
      - "feature/**"
      - "web/**"
      - "iosApp/**"
  push:
    branches:
      - main
      - master
      # Ephemeral migration batches are validated on macOS before they are
      # accepted into main. Keeping the scope to codex/next-* avoids spending
      # the iOS runner on unrelated developer branches.
      - "codex/next-*"
    paths:
      - ".github/workflows/ios-build.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "core/**"
      - "designsystem/**"
      - "ios-shared/**"
      - "feature/**"
      - "web/**"
      - "iosApp/**"

concurrency:
  group: ios-compile-${{ github.ref }}
  # An iOS run is expensive and its XCTest phase must complete to leave a
  # useful diagnostic bundle. Keep one active run per ref instead of
  # cancelling it when a newer push reaches that same ref.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compile-ios:
    name: Kotlin iOS and Swift host
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # JDK 17 remains the launcher. gradle/gradle-daemon-jvm.properties pins
      # the actual Gradle daemon to JetBrains Runtime 21 and selects its
      # architecture-specific URL (AArch64 on this Apple Silicon runner).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Kotlin/Native 2.2.21 ships platform libraries generated for Xcode 26.
      # Keep the CI SDK aligned with the compiler; Xcode 16.3 cannot resolve
      # `_LocationEssentials` emitted by that toolchain at framework link time.
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Install Xcode-compatible iOS Simulator runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_version="26.2"
          if ! xcrun simctl list runtimes available | grep -Fq "iOS ${runtime_version}"; then
            runtime_download_dir="$RUNNER_TEMP/quata-ios-${runtime_version}-runtime"
            rm -rf "$runtime_download_dir"
            mkdir -p "$runtime_download_dir"
            xcodebuild \
              -downloadPlatform iOS \
              -buildVersion "$runtime_version" \
              -exportPath "$runtime_download_dir"
            runtime_dmg="$(find "$runtime_download_dir" -name '*.dmg' -type f -print -quit)"
            test -n "$runtime_dmg"
            xcodebuild -importPlatform "$runtime_dmg"
          fi
          # Xcode can retain a stale CoreSimulator connection after importing a runtime.
          # Restart before creating a device so simctl and xcodebuild use the same registry.
          pkill -f 'CoreSimulatorService' || true
          sleep 3
          runtime_identifier="$(
            xcrun simctl list runtimes available -j | python3 -c 'import json,sys; print(next((runtime["identifier"] for runtime in json.load(sys.stdin)["runtimes"] if runtime.get("isAvailable") and runtime.get("name", "") == "iOS 26.2"), ""))'
          )"
          device_type_identifier="$(
            xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print(next((device_type["identifier"] for device_type in json.load(sys.stdin)["devicetypes"] if device_type.get("name") == "iPhone 16 Pro"), ""))'
          )"
          test -n "$runtime_identifier"
          test -n "$device_type_identifier"
          device_name="Quata CI iPhone iOS ${runtime_version}"
          simulator_udid="$(
            xcrun simctl list devices -j | python3 -c 'import json,sys; expected=sys.argv[1]; print(next((device["udid"] for devices in json.load(sys.stdin)["devices"].values() for device in devices if device.get("name") == expected), ""))' "$device_name"
          )"
          if [[ ! "$simulator_udid" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            simulator_udid="$(xcrun simctl create "$device_name" "$device_type_identifier" "$runtime_identifier")"
          fi
          test "$simulator_udid" = "$(xcrun simctl list devices -j | python3 -c 'import json,sys; expected=sys.argv[1]; print(next((device["udid"] for devices in json.load(sys.stdin)["devices"].values() for device in devices if device.get("udid") == expected), ""))' "$simulator_udid")"
          echo "QUATA_IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          echo "Selected iOS runtime: $runtime_identifier"
          echo "Selected simulator type: $device_type_identifier"
          echo "Selected simulator UUID: $simulator_udid"
          xcrun simctl list devices -j

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/ios
          {
            echo "Runner: $RUNNER_OS $RUNNER_ARCH"
            java -version 2>&1
            bash ./gradlew --version
            xcodebuild -version
            xcodegen --version
            sw_vers
          } | tee build/reports/ios/toolchain.log

      - name: Parse Swift framework tests
        run: xcrun swiftc -frontend -parse iosApp/iosAppTests/QuataFeedFrameworkTests.swift

      - name: Compile all Kotlin iOS targets
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew \
            :core:compileKotlinIosArm64 \
            :core:compileKotlinIosSimulatorArm64 \
            :designsystem:compileKotlinIosArm64 \
            :designsystem:compileKotlinIosSimulatorArm64 \
            :feature:auth:compileKotlinIosArm64 \
            :feature:auth:compileKotlinIosSimulatorArm64 \
            :feature:chat:compileKotlinIosArm64 \
            :feature:chat:compileKotlinIosSimulatorArm64 \
            :feature:externalshare:compileKotlinIosArm64 \
            :feature:externalshare:compileKotlinIosSimulatorArm64 \
            :feature:feed:compileKotlinIosArm64 \
            :feature:feed:compileKotlinIosSimulatorArm64 \
            :feature:neighborhoods:compileKotlinIosArm64 \
            :feature:neighborhoods:compileKotlinIosSimulatorArm64 \
            :feature:notifications:compileKotlinIosArm64 \
            :feature:notifications:compileKotlinIosSimulatorArm64 \
            :feature:official:compileKotlinIosArm64 \
            :feature:official:compileKotlinIosSimulatorArm64 \
            :feature:postcomposer:compileKotlinIosArm64 \
            :feature:postcomposer:compileKotlinIosSimulatorArm64 \
            :feature:profile:compileKotlinIosArm64 \
            :feature:profile:compileKotlinIosSimulatorArm64 \
            :feature:settings:compileKotlinIosArm64 \
            :feature:settings:compileKotlinIosSimulatorArm64 \
            :feature:whatsnew:compileKotlinIosArm64 \
            :feature:whatsnew:compileKotlinIosSimulatorArm64 \
            :ios-shared:compileKotlinIosArm64 \
            :ios-shared:compileKotlinIosSimulatorArm64 \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee build/reports/ios/kotlin-ios.log

      - name: Link QuataShared simulator framework
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew \
            :ios-shared:linkDebugFrameworkIosSimulatorArm64 \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee build/reports/ios/framework-link.log

      - name: Assemble QuataShared XCFramework
        # The XCFramework task may invoke both device and simulator linkers.
        # Bound it independently so a linker/Gradle deadlock yields a process
        # snapshot instead of consuming the complete workflow timeout.
        timeout-minutes: 17
        shell: bash
        run: |
          set -euo pipefail
          run_watchdog() {
            local timeout_seconds="$1"
            local log_file="$2"
            shift 2
            local status
            if python3 scripts/run-ios-command-watchdog.py \
              --timeout-seconds "$timeout_seconds" \
              --log "$log_file" \
              -- "$@"; then
              status=0
            else
              status=$?
            fi
            cat "$log_file"
            return "$status"
          }
          run_watchdog 900 build/reports/ios/xcframework.log bash ./gradlew \
            :ios-shared:assembleQuataSharedDebugXCFramework \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Validate iOS signing and runtime contract
        shell: bash
        run: bash scripts/check-ios-release-readiness.sh

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build Swift iOS host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/reports/ios/QuataIos.xcresult build/ios-derived-data
          xcodebuild \
            -project iosApp/QuataIos.xcodeproj \
            -scheme QuataIos \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios-derived-data \
            -resultBundlePath build/reports/ios/QuataIos.xcresult \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            2>&1 | tee build/reports/ios/xcodebuild.log

      # Keep simulator boot separate from XCTest. The first iOS 26.2 boot performs data
      # migrations; watchdog logs distinguish that failure from a test failure.
      - name: Boot test simulator
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="${QUATA_IOS_SIMULATOR_UDID:?The runtime setup did not publish a simulator UUID}"
          run_watchdog() {
            local timeout_seconds="$1"
            local log_file="$2"
            shift 2
            local status
            if python3 scripts/run-ios-command-watchdog.py \
              --timeout-seconds "$timeout_seconds" \
              --log "$log_file" \
              -- "$@"; then
              status=0
            else
              status=$?
            fi
            cat "$log_file"
            return "$status"
          }
          echo "Booting the simulator created for this job: $simulator_udid"
          # A non-zero boot commonly means the device is already booted. A
          # watchdog timeout is different: fail with its process snapshot.
          if run_watchdog 60 build/reports/ios/simctl-boot.log \
            xcrun simctl boot "$simulator_udid"; then
            :
          else
            boot_status=$?
            if [[ "$boot_status" -eq 124 ]]; then
              exit "$boot_status"
            fi
            echo "simctl boot exited $boot_status; verifying its current boot status."
          fi
          run_watchdog 180 build/reports/ios/simctl-bootstatus.log \
            xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl list devices -j > build/reports/ios/simulator-devices-after-boot.json

      - name: Test Swift/Kotlin iOS host boundary
        # Twenty minutes for xcodebuild plus the watchdog's SIGTERM/SIGKILL grace.
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="${QUATA_IOS_SIMULATOR_UDID:?The runtime setup did not publish a simulator UUID}"
          destination="platform=iOS Simulator,id=$simulator_udid"
          run_watchdog() {
            local timeout_seconds="$1"
            local log_file="$2"
            shift 2
            local status
            if python3 scripts/run-ios-command-watchdog.py \
              --timeout-seconds "$timeout_seconds" \
              --log "$log_file" \
              -- "$@"; then
              status=0
            else
              status=$?
            fi
            cat "$log_file"
            return "$status"
          }
          echo "Testing on the booted simulator: $simulator_udid"
          rm -rf build/reports/ios/QuataIos-tests.xcresult
          run_watchdog 1200 build/reports/ios/xcodebuild-tests.log xcodebuild \
            -project iosApp/QuataIos.xcodeproj \
            -scheme QuataIos \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "$destination" \
            -derivedDataPath build/ios-derived-data \
            -resultBundlePath build/reports/ios/QuataIos-tests.xcresult \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 90 \
            -maximum-test-execution-time-allowance 180 \
            test

      - name: Capture simulator diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/ios
          xcrun simctl list devices -j > build/reports/ios/simulator-devices-after-test.json || true
          simulator_udid="${QUATA_IOS_SIMULATOR_UDID:-}"
          if [[ -n "$simulator_udid" ]]; then
            xcrun simctl getenv "$simulator_udid" SIMULATOR_DEVICE_NAME \
              > build/reports/ios/simulator-name-after-test.log 2>&1 || true
          fi

      # Archive is deliberately after XCTest: an archive problem must not hide
      # the independent simulator boundary result in this same CI run.
      - name: Validate unsigned generic-device archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/reports/ios/QuataIos-unsigned.xcarchive build/ios-archive-derived-data
          bash scripts/archive-ios-unsigned.sh \
            2>&1 | tee build/reports/ios/xcodebuild-archive-unsigned.log

      - name: Write report summary
        if: always()
        shell: bash
        run: |
          if [[ -d build/reports/ios/QuataIos-tests.xcresult ]]; then
            xcrun xcresulttool get test-results summary \
              --path build/reports/ios/QuataIos-tests.xcresult \
              > build/reports/ios/xctest-summary.json || true
          fi
          {
            echo "## iOS compilation report"
            echo
            echo "- Runner: \`macos-15\` (Apple Silicon)"
            echo "- Xcode: \`26.3\`"
            echo "- Kotlin targets: device ARM64 and simulator ARM64"
            echo "- Swift host: \`QuataIos\` for the iOS Simulator"
            echo "- Generic-device archive: unsigned structural validation only (not IPA/export/distribution)"
            echo "- UI test: Swift host presents the exported Compose migration surface"
            echo "- Result bundles: \`QuataIos.xcresult\`, \`QuataIos-tests.xcresult\`"
            echo
            if [[ -f build/reports/ios/xcodebuild.log ]]; then
              echo "### Last Xcode diagnostics"
              echo '```text'
              grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build/reports/ios/xcodebuild.log | tail -n 80 || true
              echo '```'
            fi
            if [[ -f build/reports/ios/xcodebuild-tests.log ]]; then
              echo "### Last UI test diagnostics"
              echo '```text'
              grep -E "error:|warning:|TEST (SUCCEEDED|FAILED)" build/reports/ios/xcodebuild-tests.log | tail -n 80 || true
              echo '```'
            fi
            if [[ -f build/reports/ios/xcodebuild-archive-unsigned.log ]]; then
              echo "### Unsigned generic-device archive diagnostics"
              echo '```text'
              grep -E "error:|warning:|ARCHIVE (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)" build/reports/ios/xcodebuild-archive-unsigned.log | tail -n 80 || true
              echo '```'
            fi
            if [[ -f build/reports/ios/xctest-summary.json ]]; then
              echo "### XCTest result summary"
              echo '```json'
              cat build/reports/ios/xctest-summary.json
              echo '```'
            fi
            if [[ ! -f build/reports/ios/xcodebuild.log && ! -f build/reports/ios/xcodebuild-tests.log && -f build/reports/ios/kotlin-ios.log ]]; then
              echo "### Last Kotlin diagnostics"
              echo '```text'
              grep -E "^[ew]: |error:|warning:|FAILURE:" build/reports/ios/kotlin-ios.log | tail -n 80 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Gradle reports
        if: always()
        shell: bash
        run: |
          mkdir -p build/reports/ios/gradle
          find . -type f -path "*/build/reports/*" \
            ! -path "./build/reports/ios/*" \
            -exec cp -p {} build/reports/ios/gradle/ \; || true

      - name: Upload iOS diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-report-${{ github.run_id }}
          path: |
            build/reports/ios/
            iosApp/QuataIos.xcodeproj/
            ios-shared/build/XCFrameworks/debug/QuataShared.xcframework/
            build/reports/ios/QuataIos-unsigned.xcarchive/
          if-no-files-found: warn
          retention-days: 30
