name: QuataIos
options:
  bundleIdPrefix: com.quata
targets:
  QuataIos:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quata.ios
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: iosApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      # QuataFeed re-exports :core for Swift; do not embed a separate Core framework.
      - framework: ../feature/feed/build/bin/iosSimulatorArm64/debugFramework/QuataFeed.framework
        embed: true
  QuataIosUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosAppUITests
    dependencies:
      - target: QuataIos
  QuataIosTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosAppTests
    dependencies:
      - target: QuataIos
      - framework: ../feature/feed/build/bin/iosSimulatorArm64/debugFramework/QuataFeed.framework
schemes:
  QuataIos:
    build:
      targets:
        QuataIos: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuataIosTests
        - QuataIosUITests
