name: QuataIos
options:
  bundleIdPrefix: com.quata
targets:
  QuataIos:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quata.ios
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/QuataIos.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      # The umbrella owns Kotlin/Native exports; do not embed feature frameworks separately.
      - framework: ../ios-shared/build/XCFrameworks/debug/QuataShared.xcframework
        embed: true
      - target: QuataShareExtension
        embed: true
  QuataShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quata.ios.shareextension
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: iosShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosShareExtension/QuataShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
  QuataIosUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosAppUITests
    dependencies:
      - target: QuataIos
  QuataIosTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosAppTests
    dependencies:
      - target: QuataIos
      - framework: ../ios-shared/build/XCFrameworks/debug/QuataShared.xcframework
schemes:
  QuataIos:
    build:
      targets:
        QuataIos: all
        QuataShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuataIosTests
        - QuataIosUITests
