name: QuataIos
options:
  bundleIdPrefix: com.quata
configs:
  Debug: debug
  SimulatorSigned: debug
  Release: release
targets:
  QuataIos:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
    configFiles:
      Debug: Configuration/QuataPublicRuntime.debug.xcconfig
      SimulatorSigned: Configuration/QuataPublicRuntime.debug.xcconfig
      Release: Configuration/QuataPublicRuntime.release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quata.ios
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/QuataIos.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        # This phase writes Compose resources into the final app bundle, so
        # Xcode must permit it and run it before its normal signing phases.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Registration remains explicitly disabled until a coordinated iOS challenge host
        # and Edge channel release supplies every other runtime input.
        QUATA_IOS_REGISTRATION_ENABLED: "false"
      configs:
        SimulatorSigned:
          # Ad-hoc simulator signing cannot authorize restricted entitlements.
          # Keep this local visual-gate lane entitlement-free so launchd accepts it.
          CODE_SIGN_ENTITLEMENTS: ""
        Release:
          # These values are deliberately supplied only by the signing environment.
          # A signed Release build with any missing value must fail in Xcode instead
          # of falling back to automatic signing or an arbitrary local team.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: $(QUATA_DEVELOPMENT_TEAM)
          PROVISIONING_PROFILE_SPECIFIER: $(QUATA_IOS_APP_PROVISIONING_PROFILE)
          QUATA_APNS_ENVIRONMENT: production
    dependencies:
      # The umbrella owns Kotlin/Native exports; do not embed feature frameworks separately.
      - framework: ../ios-shared/build/XCFrameworks/debug/QuataShared.xcframework
        embed: true
      - target: QuataShareExtension
        embed: true
    postBuildScripts:
      - name: Synchronize Compose resources into QuataIos.app
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/../scripts/sync-ios-compose-resources.sh" \
            "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/compose-resources/composeResources/quata.designsystem.generated.resources/font/quata_header_logo_q_subset.ttf
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/compose-resources/composeResources/quata.designsystem.generated.resources/drawable/quata_feed_emoji_sos.png
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/compose-resources/composeResources/quata.designsystem.generated.resources/drawable/quata_feed_emoji_rank.png
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/compose-resources/composeResources/quata.designsystem.generated.resources/drawable/quata_feed_emoji_location.png
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/compose-resources/composeResources/quata.designsystem.generated.resources/drawable/quata_feed_emoji_note.png
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/compose-resources/composeResources/quata.designsystem.generated.resources/drawable/quata_feed_emoji_document.png
  QuataShareQueue:
    type: library.static
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosShareQueue
    settings:
      base:
        PRODUCT_MODULE_NAME: QuataShareQueue
        DEFINES_MODULE: "YES"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: iosShareQueue/ShareQueueLock.h
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
      configs:
        Debug:
          ENABLE_TESTABILITY: "YES"
  QuataShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quata.ios.shareextension
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: iosShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosShareExtension/QuataShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
      configs:
        SimulatorSigned:
          CODE_SIGN_ENTITLEMENTS: ""
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: $(QUATA_DEVELOPMENT_TEAM)
          PROVISIONING_PROFILE_SPECIFIER: $(QUATA_IOS_SHARE_EXTENSION_PROVISIONING_PROFILE)
    dependencies:
      - target: QuataShareQueue
  QuataIosUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quata.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: QuataIos
  QuataIosTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quata.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: QuataIos
      - framework: ../ios-shared/build/XCFrameworks/debug/QuataShared.xcframework
  QuataShareExtensionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosShareExtensionTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quata.ios.shareextension.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: QuataShareQueue
schemes:
  QuataIos:
    build:
      targets:
        QuataIos: all
        QuataShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuataIosTests
        - QuataIosUITests
        - QuataShareExtensionTests
