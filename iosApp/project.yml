name: QuataIos
options:
  bundleIdPrefix: com.quata
targets:
  QuataIos:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quata.ios
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: "Quata necesita acceso a la cámara para capturar fotos que quieras compartir."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Quata necesita acceso al micrófono para grabar mensajes de audio."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Quata necesita tu ubicación para las funciones de proximidad y SOS."
        # Configured by Xcode build settings or CI secrets. Do not store a Supabase service-role
        # key in this project; only the client-safe URL and publishable key are consumed at runtime.
        INFOPLIST_KEY_QUATA_SUPABASE_URL: "$(QUATA_SUPABASE_URL)"
        INFOPLIST_KEY_QUATA_SUPABASE_PUBLISHABLE_KEY: "$(QUATA_SUPABASE_PUBLISHABLE_KEY)"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      # QuataFeed re-exports :core for Swift; do not embed a separate Core framework.
      - framework: ../feature/feed/build/bin/iosSimulatorArm64/debugFramework/QuataFeed.framework
        embed: true
  QuataIosUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosAppUITests
    dependencies:
      - target: QuataIos
  QuataIosTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosAppTests
    dependencies:
      - target: QuataIos
      - framework: ../feature/feed/build/bin/iosSimulatorArm64/debugFramework/QuataFeed.framework
schemes:
  QuataIos:
    build:
      targets:
        QuataIos: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuataIosTests
        - QuataIosUITests
